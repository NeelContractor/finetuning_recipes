[project]
name = "fine-tuning-recipes"
version = "0.1.0"
description = "End-to-end post-training recipes for small language models — CPT, SFT, DPO, ORPO, and reasoning."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "absl-py>=2.4.0",
    "arxiv>=2.4.0",
    "bert-score>=0.3.13",
    "datasets==3.6",
    "evaluate>=0.4.6",
    "gradio>=6.11.0",
    "outlines>=1.2.12",
    "peft>=0.18.1",
    "pip>=26.0.1",
    "pypdf>=6.6.2",
    "rich>=14.3.2",
    "rouge-score>=0.1.2",
    "sacrebleu>=2.6.0",
    "torch>=2.7",
    "torchvision>=0.25.0",
    "sentence-transformers>=3.0.0",
    "transformers>=4.57.6,<5",
    "trl>=0.24.0",
    "unsloth>=2026.1.4",
    "mlx>=0.31.2",
    "mlx-lm>=0.29.1",
    "umap-learn>=0.5.0",
    "plotly>=5.0.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
]
